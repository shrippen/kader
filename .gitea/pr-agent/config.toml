# PR-Agent settings for Kader (.gitea/workflows/pr-agent.yml); the rest
# are PR-Agent's defaults.
[config]
git_provider = "gitea"
response_language = "de-DE"
max_model_tokens = 128000
fallback_models = []
publish_output_progress = false
# The repository rules go along as context.
repo_context_files = ["agent.md"]

[pr_reviewer]
num_max_findings = 5
require_can_be_split_review = true
enable_review_labels_effort = false
enable_review_labels_security = false
extra_instructions = """
You review pull requests of Kader, automatic cropping of camera scans
of film negatives: Python/OpenCV detection (kader.py stage 1 film strip,
stage 2 image; two passes with a film-wide aspect ratio) and a local web
review UI; darktable, RawTherapee and Lightroom can be attached.
The PRs are written by an AI agent; review them as a careful second
reader, not as their author.

Report only findings that matter:
- Bugs: a concrete input or state and the wrong result or crash it gives.
  Name file and line.
- Detection: tuning for single images instead of the bias across a
  roll; code that handles only one polarity (image lighter or darker
  than the film border); changed results without a run against the
  corrected set (ΔHeight < 100 px, ΔWidth < 50 px).
- User files: originals or editor sidecars changed or lost.
- Missing tests for new behaviour; demo rolls not updated.
- Breaches of the repository rules (agent.md).

Skip style, naming and formatting (the tests run separately), praise, and
guesses you cannot back with the diff. When you find nothing that
matters, say so in one line.
"""

[pr_code_suggestions]
extra_instructions = """
Only suggestions that fix a bug or a missing check; no style.
"""
